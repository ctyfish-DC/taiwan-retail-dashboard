name: TAIEX Daily Technical Analysis LINE Notify

on:
  # 排程已暫停（大盤更新停止發布）。保留 workflow_dispatch 可手動觸發測試。
  # 原排程：每個交易日 15:00 台灣時間（UTC+8）= 07:00 UTC
  # schedule:
  #   - cron: "0 7 * * 1-5"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  notify:
    name: Fetch TAIEX indicators and send LINE message
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run TAIEX daily notify
        env:
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python scripts/taiex_notify.py
        working-directory: ${{ github.workspace }}
