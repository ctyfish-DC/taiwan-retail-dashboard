name: Eyewear Intelligence Weekly Notify

on:
  schedule:
    # Every Wednesday at 02:00 UTC = Wednesday 10:00 Taiwan time (UTC+8)
    - cron: "0 2 * * 3"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  notify:
    name: Fetch eyewear news and send LINE message
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run eyewear weekly notify
        env:
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python scripts/eyewear_notify.py
        working-directory: ${{ github.workspace }}

      - name: Commit updated state file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/eyewear_state.json
          git diff --staged --quiet || git commit -m "chore: update eyewear notify state [skip ci]"
          git push
